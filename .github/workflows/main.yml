
name: Build MS Jewellers APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/main.yml'
      - 'MS_Jewellers_Android_Project.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip MS_Jewellers_Android_Project.zip -d .

      - name: Build APK
        working-directory: MS_Jewellers_Android_Project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MS-Jewellers-APK
          path: MS_Jewellers_Android_Project/app/build/outputs/apk/debug/app-debug.apk
